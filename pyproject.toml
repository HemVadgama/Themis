[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-testbed"
version = "0.1.0"
description = "Deterministic testbed for constrained autonomous coordination experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Themis contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
orbit = ["numpy>=1.24", "pandas>=2.0", "skyfield>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
themis = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
