name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: node --check src/viewer/static/app.js
      - run: node --check src/viewer/static/temporal.js
      - run: node tests/viewer_temporal.test.js
      - run: themis validate examples/basic.toml
      - run: themis run examples/basic.toml --output-dir "${{ runner.temp }}/themis-results"
      - run: themis view --help
      - run: python -m build
