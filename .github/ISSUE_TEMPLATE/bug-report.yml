name: Reproducible bug
description: Report incorrect software behavior with a minimal reproduction.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, version, resolved config, seed, and relevant artifact lines. Remove sensitive data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, installation method, and external protocol packages.
    validations:
      required: true
